name: h3 billing watchdog

# Every 5 minutes, ask the H3 Studio watchdog to check the RunPod serverless endpoint.
# It scales the endpoint to 0 workers if a worker keeps billing with no work, and
# restores it once the workers are gone. All logic lives in the studio's /api/watchdog.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write # keepalive commit, see below

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call watchdog
        env:
          WATCHDOG_SECRET: ${{ secrets.WATCHDOG_SECRET }}
          WATCHDOG_URL: ${{ vars.WATCHDOG_URL }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 -m 60 \
            -H "Authorization: Bearer $WATCHDOG_SECRET" \
            -H "x-watchdog-source: github-actions" \
            "$WATCHDOG_URL" > out.json
          python3 -c "import json;d=json.load(open('out.json'));c=d['state']['lastCheck'];s=d['snapshot'];print('verdict:',c['verdict'],'| running:',s['running'],'queued:',s['queued'],'inProgress:',s['inProgress'],'| spend/h:',s['spendPerHr'])"

      # A failed run is how you get an email: GitHub notifies on failed scheduled runs.
      # The watchdog returns each alert-worthy incident (forced scale-down, circuit-breaker
      # hold) exactly once, so one incident means one failed run, not a failure every 5 min.
      # If the call itself fails (studio down, bad secret), the step above already fails.
      - name: Fail on new incidents
        run: |
          python3 - <<'PY'
          import json, sys
          alerts = json.load(open("out.json")).get("alerts") or []
          for a in alerts:
              print(f"::error title=H3 watchdog {a['kind']}::{a['at']} {a['detail']}")
          sys.exit(1 if alerts else 0)
          PY

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # Push an empty commit when the last one is older than 30 days.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if idle for 30 days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: $(date -u +%F)"
            git push
          else
            echo "last commit $(( ($(date +%s) - last) / 86400 )) days ago, nothing to do"
          fi
